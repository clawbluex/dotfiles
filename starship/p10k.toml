"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false
scan_timeout = 1000

format = """
[ $os ](bg:#a3aed2 fg:#090c0c)\
[\ue0b4](bg:#769ff0 fg:#a3aed2)\
$directory\
[\ue0b4](fg:#769ff0 bg:#394260)\
$fill\
$hostname\
$nodejs\
$rust\
$golang\
$php\
$time\
[\ue0b4](fg:#1d2230)\
\n$character"""

right_format = """
$git_branch\
$git_status\
"""

[fill]
disabled = false
symbol = '-'

[hostname]
ssh_only = true
format = "[\ue0b6](fg:#a3aed2)[$hostname](bg:#a3aed2 fg:#090c0c)"

[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[$read_only]($style)[ $path ]($style)"
truncation_length = 3
truncation_symbol = "\u2026"

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[php]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[time]
disabled = false
time_format = "%T"
style = "bg:#1d2230"
format = '[[ $time  ](fg:#a0a9cb bg:#1d2230)]($style)'
